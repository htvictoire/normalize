services:
  postgres:
    image: postgres:16
    container_name: normalize-db
    environment:
      POSTGRES_USER: normalize
      POSTGRES_PASSWORD: normalize
      POSTGRES_DB: normalize
    ports:
      - "5438:5432"
    volumes:
      - normalize_dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normalize -d normalize"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: normalize-redis
    ports:
      - "6378:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  normalize_dbdata:

