[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "normalization-engine"
version = "0.1.0"
description = "Normalization Engine service skeleton"
readme = "implementation_guide_v2.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.0",
    "fastapi>=0.115",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "requests>=2.32",
    "uvicorn>=0.32",
    "boto3>=1.35",
    "celery[redis]>=5.3",
    "pycountry>=26.2.16",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "types-openpyxl",
    "boto3-stubs[s3]",
]
ai = [
    "anthropic>=0.120",
    "google-genai>=1.0",
]


[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["requests", "requests.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google", "google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pycountry", "pycountry.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py314"
preview = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ARG",
    "SIM",
    "RET",
    "RUF",
    "C4",
    "PIE",
    "PT",
    "N",
    "A",
    "ICN",
    "Q",
    "TID",
    "S",
    "TRY",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
]
ignore = []
extend-ignore = [
    # SQL is assembled from validated identifiers and quoted literals in this project.
    "S608",
    # Keep exception messaging straightforward without forcing custom exception classes.
    "TRY003",
    # Pipeline/stage APIs are intentionally explicit and exceed generic complexity caps.
    "PLR0912",
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0917",
    "PLR6301",
]

[tool.ruff.lint.isort]
sections = { shared = ["shared"], app = ["app"], suggestion = ["suggestion"], profiling = ["profiling"], conversion = ["conversion"] }
section-order = [
    "future",
    "standard-library",
    "third-party",
    "shared",
    "app",
    "suggestion",
    "profiling",
    "conversion",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "PLR2004",
]
