[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "normalization-engine"
version = "0.1.0"
description = "Normalization Engine service skeleton"
readme = "implementation_guide_v2.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "ruff",
]

[project.scripts]
normalize-runner = "runner:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py314"
preview = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ARG",
    "SIM",
    "RET",
    "RUF",
    "C4",
    "PIE",
    "PT",
    "N",
    "A",
    "ICN",
    "Q",
    "TID",
    "S",
    "TRY",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
]
ignore = []
